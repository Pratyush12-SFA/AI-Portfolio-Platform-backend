name: Backend CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  backend-ci:
    name: Backend Build & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AIPortfolio.API/AIPortfolio.API.csproj

      - name: Build backend
        run: dotnet build AIPortfolio.API/AIPortfolio.API.csproj --configuration Release --no-restore

      - name: Build Docker image
        run: docker build -t ascend-api:ci .
