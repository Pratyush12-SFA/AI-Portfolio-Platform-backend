name: Backend CI/CD

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - development

  workflow_dispatch:

jobs:
  build:
    name: Backend Build & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AIPortfolio.API/AIPortfolio.API.csproj

      - name: Build backend
        run: dotnet build AIPortfolio.API/AIPortfolio.API.csproj --configuration Release --no-restore

      - name: Build Docker image
        run: docker build -t ascend-api:ci .

  docker-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/development'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ascend-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ascend-api:${{ github.sha }}
